[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "consumable-inventory"
version = "0.1.0"
description = "Self-hosted tracking of household consumables: what's on hand, what's running low, and what to buy."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
consumable-inventory = "consumable_inventory.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/consumable_inventory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
